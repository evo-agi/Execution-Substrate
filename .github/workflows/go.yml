# Build, vet and test the Go module on Linux.
#
# A pull_request run uses this file as it appears in the pull request's merge
# commit, so a pull request can be checked before this file reaches its base.
# Push runs cover trunk_dev after a merge.
name: go

on:
  pull_request:
  push:
    branches:
      - trunk_dev

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Use exactly the toolchain installed from go.mod and the committed
      # go.sum; never download a different toolchain or rewrite go.mod.
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      # Environment-only tests. They need the macOS operator host or binaries
      # built outside this repository, so they fail on a GitHub Linux runner
      # for host reasons, not code reasons. The gating test step skips exactly
      # these names; the next step still runs exactly these names on every run
      # without blocking, and they run unchanged everywhere else.
      #
      # TODO: port each test so it passes on a Linux runner without weakening
      # it, then remove it from this list.
      #
      # execution-substrate (root package), Remote Alpha operator-host tests:
      #   root-owned status witnesses and staged-leaf custody on the operator
      #   host:
      #     TestRemoteAlphaESServiceTLSStatusFailureWitnessBootstrapOwnedTerminal
      #     TestRemoteAlphaESServiceTLSStatusRootLoadedStageCustody
      #     TestRemoteAlphaESServiceTLSStatusStageFIFOSubstitution
      #     TestRemoteAlphaOperatorRecoverySessionESTLSStatusStageFIFORefusal
      #   macOS /private/tmp staging path:
      #     TestRemoteAlphaOperatorRecoverySessionESTLSStatusRemoteWrapperTrap
      #   sudo-visible SPIRE socket path on the operator host:
      #     TestRemoteAlphaOperatorRecoverySessionVaultWorkloadAuthBootstrapPrepareSpireBundleReadClassifiesTraversalAmbiguityWithSudoVisibleInspection
      #   the ds operator account:
      #     TestRemoteAlphaP0tGrammarDiagnosticBootstrapLifecycleComposition
      #     TestRemoteAlphaP0tGrammarDiagnosticPriorReaderCloseSuppression
      #     TestRemoteAlphaP0tGrammarDiagnosticV2VersionedBootstrap
      #   host kernel mitigation state and installed host tools:
      #     TestRemoteAlphaRuntimeSecurityBoundaryCVE31431UnprovedMitigationStaysVulnerable
      #     TestRemoteAlphaRuntimeSecurityBoundaryCVE31431VulnerableWithoutMitigationBlocks
      #     TestRemoteAlphaRuntimeSecurityBoundaryCheckMissingToolsStayHonest
      # es/app, the runner image's own Go on the default PATH defeats the
      # missing-Go fixture:
      #     TestSupportedLocalSetupExactGoPreflightBeforeMutation
      #     TestSupportedLocalProofExactGoPreflightBeforeMutation
      # es/admission/internal/reliablesubmit, historical opener binaries built
      # from older trees plus an external probe overlay (ES_REPLAY_*_PROBE):
      #     TestSQLiteV4PreviousSchema3BinaryRefusesWithoutMutation
      #     TestSQLiteV3OldBinaryRefusesWithoutMutation
      #     TestOperationalHandoffSchema4BinaryRefusesSchema5 (added by PR #12)
      ENVIRONMENT_ONLY_TESTS: >-
        TestRemoteAlphaESServiceTLSStatusFailureWitnessBootstrapOwnedTerminal
        TestRemoteAlphaESServiceTLSStatusRootLoadedStageCustody
        TestRemoteAlphaESServiceTLSStatusStageFIFOSubstitution
        TestRemoteAlphaOperatorRecoverySessionESTLSStatusStageFIFORefusal
        TestRemoteAlphaOperatorRecoverySessionESTLSStatusRemoteWrapperTrap
        TestRemoteAlphaOperatorRecoverySessionVaultWorkloadAuthBootstrapPrepareSpireBundleReadClassifiesTraversalAmbiguityWithSudoVisibleInspection
        TestRemoteAlphaP0tGrammarDiagnosticBootstrapLifecycleComposition
        TestRemoteAlphaP0tGrammarDiagnosticPriorReaderCloseSuppression
        TestRemoteAlphaP0tGrammarDiagnosticV2VersionedBootstrap
        TestRemoteAlphaRuntimeSecurityBoundaryCVE31431UnprovedMitigationStaysVulnerable
        TestRemoteAlphaRuntimeSecurityBoundaryCVE31431VulnerableWithoutMitigationBlocks
        TestRemoteAlphaRuntimeSecurityBoundaryCheckMissingToolsStayHonest
        TestSupportedLocalSetupExactGoPreflightBeforeMutation
        TestSupportedLocalProofExactGoPreflightBeforeMutation
        TestSQLiteV4PreviousSchema3BinaryRefusesWithoutMutation
        TestSQLiteV3OldBinaryRefusesWithoutMutation
        TestOperationalHandoffSchema4BinaryRefusesSchema5
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Show toolchain
        run: go version

      # Typed source guards load packages offline (GOPROXY=off), so every
      # module in the graph must already be in the module cache.
      - name: Download modules
        run: go mod download

      - name: Verify module downloads
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          pattern="^($(printf '%s' "$ENVIRONMENT_ONLY_TESTS" | tr -s ' ' '|'))\$"
          go test -count=1 -skip "$pattern" ./...

      - name: Environment-only tests (non-blocking)
        continue-on-error: true
        run: |
          pattern="^($(printf '%s' "$ENVIRONMENT_ONLY_TESTS" | tr -s ' ' '|'))\$"
          go test -count=1 -run "$pattern" ./...
