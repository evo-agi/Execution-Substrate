# Probe only: runs on pushes to this probe branch. On a GitHub-hosted runner
# with Nomad, Vault and SPIRE installed, it runs the launcher tests as the
# runner user and as a second user whose UID differs from its GID, the
# bring-up test three times as the runner user and once as that second user
# (checking that ARS, EGS, AGS and ES all ran with that user's --user and that
# no root-owned file is left in the test workspace), the docs tests, the root
# package with PR #14's 11 environment-only skips, and the whole es/app
# package. Not part of the change under review.
name: probe-bringup

on:
  push:
    branches:
      - claude/project-thread-a9tcoa-bringup-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      # The runner is an AWS instance whose EC2 metadata endpoint does not
      # answer; Nomad's env_aws fingerprinter then fails client setup.
      AWS_EC2_METADATA_DISABLED: "true"
      SKIP: '^TestRemoteAlphaESServiceTLSStatusFailureWitnessBootstrapOwnedTerminal$|^TestRemoteAlphaESServiceTLSStatusRootLoadedStageCustody$|^TestRemoteAlphaESServiceTLSStatusStageFIFOSubstitution$|^TestRemoteAlphaOperatorRecoverySessionESTLSStatusStageFIFORefusal$|^TestRemoteAlphaOperatorRecoverySessionESTLSStatusRemoteWrapperTrap$|^TestRemoteAlphaP0tGrammarDiagnosticBootstrapLifecycleComposition$|^TestRemoteAlphaP0tGrammarDiagnosticPriorReaderCloseSuppression$|^TestRemoteAlphaP0tGrammarDiagnosticV2VersionedBootstrap$|^TestRemoteAlphaRuntimeSecurityBoundaryCVE31431UnprovedMitigationStaysVulnerable$|^TestRemoteAlphaRuntimeSecurityBoundaryCVE31431VulnerableWithoutMitigationBlocks$|^TestRemoteAlphaRuntimeSecurityBoundaryCheckMissingToolsStayHonest$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Host facts
        run: |
          set -x
          id; uname -r; nproc; docker version --format '{{.Server.Version}}'; ls -ld /tmp
          git log --oneline -4
      - name: Install Nomad, Vault, SPIRE (pinned by SHA-256)
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools/bin" "$tools/dl"
          fetch() { curl --fail --silent --show-error --location --retry 3 -o "$tools/dl/$2" "$1"; echo "$3  $tools/dl/$2" | sha256sum --check --strict; }
          fetch https://releases.hashicorp.com/nomad/2.1.1/nomad_2.1.1_linux_amd64.zip nomad.zip 073084f7690fdaea756ff1eff8b669b25c3a6c17778f19ae0c47606973ed3f39
          fetch https://releases.hashicorp.com/vault/2.2.2/vault_2.2.2_linux_amd64.zip vault.zip 5700edf139113609962fe371af7d2a53de8ecb720d545dc39b43de204515d3c4
          fetch https://github.com/spiffe/spire/releases/download/v1.14.4/spire-1.14.4-linux-amd64-musl.tar.gz spire.tar.gz 4482db434af8a3d2f4c5aeaef8912b21311411a175ce7daeb49ea17b776bcbf5
          unzip -q -o "$tools/dl/nomad.zip" nomad -d "$tools/bin"
          unzip -q -o "$tools/dl/vault.zip" vault -d "$tools/bin"
          echo "$tools/bin" >> "$GITHUB_PATH"
          echo "SUPPORTED_LOCAL_TEST_SPIRE_TARBALL=$tools/dl/spire.tar.gz" >> "$GITHUB_ENV"
      - name: Pull test images by digest
        run: |
          set -euo pipefail
          pull() { docker pull --quiet "$1@$2"; docker tag "$1@$2" "$1:$3"; }
          pull alpine sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc 3.20
          pull python sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e 3.13-alpine
          pull golang sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2 1.26.5-alpine3.24
      - run: nomad version && vault version && go version
      - run: go mod download
      - name: gofmt, go vet, bash -n
        run: |
          set -euo pipefail
          test -z "$(gofmt -l es/app)"
          go vet ./es/app
          for f in scripts/0[1-5]_*.sh scripts/internal/control_plane.sh; do bash -n "$f"; done
      - name: Launcher and supported-local script tests as the runner user
        run: go test ./es/app -run '^(TestESLauncherContainerUser|TestServiceLaunchersContainerUser|TestBringupUpChecksARSStorageBeforeStartingServices|TestSupportedLocalExecutionRoot.*)$' -count=1 -v 2>&1 | grep -E '^(\s*--- |ok|FAIL|PASS)|_test\.go:[0-9]+:'; exit "${PIPESTATUS[0]}"
      - name: Bring-up test as the runner user, 3 runs
        run: |
          set -uo pipefail
          test "$(id -u)" != 0
          echo "operator $(id -u):$(id -g)"
          for i in 1 2 3; do
            start=$(date +%s)
            # Other services still write root-owned files into kept workspaces,
            # so each run's workspace is found by time, not removed.
            touch "$RUNNER_TEMP/mark$i"; sleep 1
            EXECUTION_PLATFORM_KEEP_TEST_WORKSPACE=1 go test ./es/app -run '^TestBringupScriptUpCheckDownFullProfile$' -count=1 -v -timeout 30m 2>&1 | grep -v '"event":"' > "$RUNNER_TEMP/run$i.log"; rc=${PIPESTATUS[0]}
            echo "run $i: go test exit $rc, elapsed $(( $(date +%s) - start ))s"
            grep -E '^(--- |ok|FAIL|panic)' "$RUNNER_TEMP/run$i.log" || true
            grep -E '^\s+\S+_test\.go:[0-9]+:' "$RUNNER_TEMP/run$i.log" | cut -c1-3000 || true
            # The launcher prints the docker run command into es.log; it must
            # carry the runner user's UID:GID.
            n=0
            for d in $(find .out -maxdepth 1 -name 'bringup-script-*' -newer "$RUNNER_TEMP/mark$i"); do
              all=1
              for svc in ars egs ags es; do
                f="$d/bringup-state/logs/$svc.log"
                grep -F -- "--user $(id -u):$(id -g) " "$f" | cut -c1-300 || true
                grep -qF -- "--user $(id -u):$(id -g) " "$f" || all=0
              done
              if [ "$all" = 1 ]; then n=$((n+1)); fi
              echo "run $i: root-owned entries left in $d: $(sudo find "$d" -user root | wc -l)"
              sudo find "$d" -user root | head -20 || true
            done
            echo "run $i: workspaces whose four service logs show --user $(id -u):$(id -g): $n"
            echo "$rc $n" > "$RUNNER_TEMP/rc$i"
          done
      - name: Verdict for the runner-user bring-up runs
        run: |
          for i in 1 2 3; do read -r rc n < "$RUNNER_TEMP/rc$i"; echo "run $i rc=$rc user-lines=$n"; test "$rc" = 0; test "$n" = 1; done
      - name: Second operator whose UID differs from its GID
        run: |
          set -euo pipefail
          sudo groupadd -g 2600 opgrp
          sudo useradd -m -u 2500 -g 2600 -G docker -s /bin/bash op
          sudo install -m 0755 "$RUNNER_TEMP/tools/bin/nomad" "$RUNNER_TEMP/tools/bin/vault" /usr/local/bin/
          sudo install -o op -g opgrp -m 0644 "$SUPPORTED_LOCAL_TEST_SPIRE_TARBALL" /home/op/spire.tar.gz
          sudo mkdir /home/op/es
          git archive HEAD | sudo tar -x -C /home/op/es
          sudo chown -R op:opgrp /home/op/es
          printf '%s\n' \
            "export PATH=$(dirname "$(command -v go)"):/usr/local/bin:/usr/bin:/bin" \
            'export HOME=/home/op GOTOOLCHAIN=local GOFLAGS=-mod=readonly AWS_EC2_METADATA_DISABLED=true' \
            'export SUPPORTED_LOCAL_TEST_SPIRE_TARBALL=/home/op/spire.tar.gz' \
            'umask 022; cd /home/op/es' | sudo tee /home/op/env.sh >/dev/null
          sudo -u op env -i bash -c '. /home/op/env.sh; id; go mod download'
      - name: Launcher test as the second operator
        run: sudo -u op env -i bash -c '. /home/op/env.sh; go test ./es/app -run "^TestESLauncherContainerUser$" -count=1 -v 2>&1 | grep -E "^(\s*--- |ok|FAIL|PASS)|_test\.go:[0-9]+:"; exit "${PIPESTATUS[0]}"'
      - name: Bring-up test as the second operator, 1 run
        run: |
          set -uo pipefail
          sudo -u op env -i bash -c '. /home/op/env.sh; EXECUTION_PLATFORM_KEEP_TEST_WORKSPACE=1 go test ./es/app -run "^TestBringupScriptUpCheckDownFullProfile$" -count=1 -v -timeout 30m 2>&1 | grep -v "\"event\":\"" > /home/op/run-op.log; rc=${PIPESTATUS[0]}; echo "go test exit $rc"; echo "$rc" > /home/op/rc-op'
          sudo grep -E '^(--- |ok|FAIL|panic)' /home/op/run-op.log || true
          sudo grep -E '^\s+\S+_test\.go:[0-9]+:' /home/op/run-op.log | cut -c1-3000 || true
          n=0
          for d in $(sudo find /home/op/es/.out -maxdepth 1 -name 'bringup-script-*'); do
            all=1
            for svc in ars egs ags es; do
              f="$d/bringup-state/logs/$svc.log"
              sudo grep -F -- "--user 2500:2600 " "$f" | cut -c1-300 || true
              sudo grep -qF -- "--user 2500:2600 " "$f" || all=0
            done
            if [ "$all" = 1 ]; then n=$((n+1)); fi
            echo "root-owned entries left in $d: $(sudo find "$d" -user root | wc -l)"
          done
          echo "workspaces whose four service logs show --user 2500:2600: $n"
          test "$(sudo cat /home/op/rc-op)" = 0
          test "$n" = 1
      - name: Docs tests
        if: always()
        run: go test . -run 'Doc' -count=1 -v 2>&1 | grep -E '^(--- FAIL|ok|FAIL)|_test\.go:[0-9]+:' | head -60; exit "${PIPESTATUS[0]}"
      - name: Root package with the gate's 11 environment-only skips, informational
        if: always()
        run: go test . -count=1 -skip "$SKIP" 2>&1 | grep -E '^(--- FAIL|ok|FAIL)|_test\.go:[0-9]+:' | cut -c1-600 | head -60 || true
      - name: Whole es/app package, informational
        if: always()
        run: |
          go test ./es/app -count=1 -timeout 45m 2>&1 | grep -v '"event":"' > "$RUNNER_TEMP/app.log"; echo "go test exit ${PIPESTATUS[0]}"
          grep -E '^(--- FAIL|    --- FAIL|ok|FAIL|panic)' "$RUNNER_TEMP/app.log" || true
      - name: Leftovers
        if: always()
        run: |
          ls -la .out /tmp | head -60
          docker ps -a
          pgrep -a 'nomad|vault|spire' || true
